services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: game_delistings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: game-delistings-tracker:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PRISMA_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/game_delistings?schema=public
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/game_delistings?schema=public
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/game_delistings?schema=public

volumes:
  postgres_data:
